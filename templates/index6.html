<!DOCTYPE html>
<html>
<head>
    <title>JSON Media Viewer</title>
    <style>
        body { font-family: sans-serif; }

        #media-container {
          display: flex;
          flex-wrap: wrap;
          justify-content: center;  /* Center items horizontally */
          margin-top: 20px;
        }

        .media-item {
          width: 300px;  /* Increased width for X3D display */
          height: 250px; /* Increased height for X3D display */
          margin: 10px;
          border: 1px solid #ccc;
          padding: 5px;
          box-sizing: border-box;
          text-align: center; /* Center content within each item */
        }

        .media-item img, .media-item video {
          max-width: 100%;
          height: auto;
        }

        /* Style for X3DOM Canvas */
        .media-item x3d {
          width: 100%;
          height: 100%;
        }

        #error-message {
          color: red;
          margin-top: 10px;
          text-align: center;
        }
    </style>

    <!-- X3DOM includes -->
    <link rel='stylesheet' type='text/css' href='https://www.x3dom.org/download/x3dom.css'>
    <script src='https://www.x3dom.org/download/x3dom.js'></script>
</head>
<body>

    <h1>JSON Media Viewer</h1>

    <form method="POST" enctype="multipart/form-data" action="/upload">
        <input type="file" id="fileInput" accept=".json" name="file">
        <button type="submit">Upload JSON</button>
    </form>

    <div id="error-message">
        {% if error %}
            {{ error }}
        {% endif %}
    </div>

    <div id="media-container">
        {% for media in media_urls %}
            <div class="media-item">
                {% if media.type == 'image' %}
                    <img src="{{ media.url }}" alt="Image">
                {% elif media.type == 'video' %}
                    <video src="{{ media.url }}" controls></video>
                {% elif media.type == 'x3d' %}
                  <x3d width='300px' height='250px'>
                    <scene>
                      <inline url="{{ media.url }}"></inline>
                    </scene>
                  </x3d>
                {% endif %}
            </div>
        {% endfor %}
    </div>

</body>
</html>
