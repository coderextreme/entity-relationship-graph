<!DOCTYPE html>
<html>
<head>
    <title>JSON Media Viewer</title>
    <style>
        body { font-family: sans-serif; }

        #media-container {
          display: flex;
          flex-wrap: wrap;
          justify-content: center;  /* Center items horizontally */
          margin-top: 20px;
        }

        .media-item {
          width: 200px;
          margin: 10px;
          border: 1px solid #ccc;
          padding: 5px;
          box-sizing: border-box;
          text-align: center; /* Center content within each item */
        }

        .media-item img, .media-item video {
          max-width: 100%;
          height: auto;
        }

        .media-item .x3d-vrml-placeholder {
          width: 100%;
          height: 150px;
          background-color: #f0f0f0;
          text-align: center;
          line-height: 150px;
          font-style: italic;
        }

        #error-message {
          color: red;
          margin-top: 10px;
          text-align: center;
        }
    </style>
</head>
<body>

    <h1>JSON Media Viewer</h1>

    <input type="file" id="fileInput" accept=".json">
    <button onclick="uploadFile()">Upload JSON</button>

    <div id="error-message">
        {% if error %}
            {{ error }}
        {% endif %}
    </div>

    <div id="media-container">
        {% for media in media_urls %}
            <div class="media-item">
                {% if media.type == 'image' %}
                    <img src="{{ media.url }}" alt="Image">
                {% elif media.type == 'video' %}
                    <video src="{{ media.url }}" controls></video>
                {% elif media.type == 'x3d' or media.type == 'vrml' %}
                    <div class="x3d-vrml-placeholder">
                        X3D/VRML: <a href="{{media.url}}" target="_blank">{{ media.url }}</a>
                    </div>
                {% endif %}
            </div>
        {% endfor %}
    </div>


    <script>
        function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];

            if (file) {
                const formData = new FormData();
                formData.append('file', file);
                // This is a post but we do not use Javascript to handle the render
                // so we reload the page, it's simpler.
                // window.location.reload();

                fetch('/upload', {
                    method: 'POST',
                    body: formData
                })
                .then(response => {
		    // Check if the request was successful
		    if (!response.ok) {
		      throw new Error('Network response was not ok');
		    }
		    // Parse the JSON response
		    return response.json();
		})
                .then(data => {
                    if (data.success) {
                       // window.location.reload();
                    } else {
                        alert(data.error);
                    }
                })
                .catch(error => {
                   alert('Error uploading file. '+error);
                });
            } else {
                alert('Please select a file.');
            }
        }
    </script>

</body>
</html>
